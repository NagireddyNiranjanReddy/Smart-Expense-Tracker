{% extends "base.html" %}
{% block title %}Add transaction · SmartSpend{% endblock %}
{% block content %}
<div class="narrow"><p class="eyebrow">NEW RECORD</p><h1>Add a transaction</h1><p class="muted">Record income or an expense. Amounts are in Indian rupees (INR).</p>
<form class="panel form-card" method="post">
  <label>Description<input name="title" maxlength="120" placeholder="e.g. Groceries, monthly salary" required></label>
  <label>Amount (₹)<input type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required></label>
  <div class="form-grid"><label>Type<select name="type" required><option value="expense">Expense</option><option value="income">Income</option></select></label>
  <label>Category<select name="category" required>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label></div>
  <label>Date<input type="date" name="date" value="{{ today }}" required></label>
  <div class="actions"><button class="button">Save transaction</button><a class="button secondary" href="{{ url_for('index') }}">Cancel</a></div>
</form></div>
{% endblock %}
